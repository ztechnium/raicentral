# Restrict AI workloads: DNS + gateway only on port 8000; no blanket internet egress.
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, etc.).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rai-workload-egress
  namespace: rai-workloads
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              rai.ztechnium.com/role: enforcement-gateway
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53