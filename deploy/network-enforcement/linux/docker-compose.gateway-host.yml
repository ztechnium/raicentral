# Host-level gateway for VM reference deployments. Provider secrets only in gateway.env.
services:
  rai-gateway:
    image: rai-gateway:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - gateway.env
    environment:
      GATEWAY_ENFORCEMENT_MODE: ENFORCE
      FAIL_CLOSED_ON_RAI_UNAVAILABLE: "true"
      PROVIDER_GATEWAY_ISOLATED_CREDENTIALS: "true"